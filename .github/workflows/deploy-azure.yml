name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      image:
        description: Container image URI
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: infra/azure/main.bicep
          parameters: >-
            suffix=${{ secrets.AZURE_UNIQUE_SUFFIX }}
            apiImage=${{ inputs.image }}
            azureOpenAIEndpoint=${{ secrets.AZURE_OPENAI_ENDPOINT }}
            azureOpenAIApiKey=${{ secrets.AZURE_OPENAI_API_KEY }}
            azureOpenAIDeployment=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
            azureOpenAIApiVersion=${{ secrets.AZURE_OPENAI_API_VERSION }}
            retrievalAzureOpenAIEndpoint=${{ secrets.RETRIEVAL_AZURE_OPENAI_ENDPOINT }}
            retrievalAzureOpenAIApiKey=${{ secrets.RETRIEVAL_AZURE_OPENAI_API_KEY }}
            retrievalAzureOpenAIDeployment=${{ secrets.RETRIEVAL_AZURE_OPENAI_DEPLOYMENT }}
            retrievalAzureOpenAIApiVersion=${{ secrets.RETRIEVAL_AZURE_OPENAI_API_VERSION }}
